<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vault</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #121212; color: #fff; }
        h1 { color: #bb86fc; }
        ul { list-style: none; padding: 0; }
        li { margin: 1rem 0; background: #1e1e1e; padding: 1rem; border-radius: 8px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        a { color: #03dac6; text-decoration: none; font-size: 1.1rem; flex: 1; min-width: 200px; }
        a:hover { text-decoration: underline; }
        button { background: #bb86fc; color: #000; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #9965f4; }
        audio, img, video { outline: none; max-width: 100%; max-height: 200px; }
        audio { height: 36px; width: 100%; }
        .media-container { flex: 2; min-width: 250px; }
    </style>
</head>
<body>
    <h1>My Vault</h1>
    <ul id="vault-list"></ul>

    <script>
        const baseUrl = "https://felbrasil.github.io/myvault/";

        function copyToClipboard(url) {
            const fullUrl = url.startsWith('http') ? url : baseUrl + url;
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Error copying link: ', err);
            });
        }

        async function loadVault() {
            try {
                const response = await fetch('index.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const items = await response.json();
                const list = document.getElementById('vault-list');

                items.forEach(item => {
                    const li = document.createElement('li');
                    
                    const link = document.createElement('a');
                    link.href = item.url;
                    link.textContent = item.name;
                    link.target = "_blank";
                    
                    const mediaContainer = document.createElement('div');
                    mediaContainer.className = 'media-container';
                    
                    if (item.type === 'audio') {
                        const audio = document.createElement('audio');
                        audio.controls = true;
                        audio.src = item.url;
                        mediaContainer.appendChild(audio);
                    } else if (item.type === 'image') {
                        const img = document.createElement('img');
                        img.src = item.url;
                        img.alt = item.name;
                        mediaContainer.appendChild(img);
                    }

                    const copyBtn = document.createElement('button');
                    copyBtn.textContent = 'Copy Link';
                    copyBtn.onclick = () => copyToClipboard(item.url);

                    li.appendChild(link);
                    li.appendChild(mediaContainer);
                    li.appendChild(copyBtn);
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Failed to load vault data", err);
                document.getElementById('vault-list').innerHTML = "<li>Error loading files. Make sure index.json exists.</li>";
            }
        }

        loadVault();
    </script>
</body>
</html>
